name: billing_mobile
description: "Thyantra Billing - offline point-of-sale, stock and customer credit for small shops."
publish_to: 'none'

# build-name is the Play Store versionName, build-number the versionCode.
# Increase the build number for every upload.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  lucide_icons_flutter: ^3.1.24
  fl_chart: ^1.2.0
  intl: ^0.20.3
  uuid: ^4.6.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  sqflite: ^2.4.4+1
  path: ^1.9.1
  file_picker: ^13.1.0
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/branding/logo-icon.png
    - assets/fonts/Inter-Regular.ttf
    - assets/fonts/Inter-Bold.ttf
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-Sora.txt

  # Bundled so the app never fetches fonts at runtime and works offline.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700

# `dart run flutter_launcher_icons` regenerates the Android launcher icons.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon-legacy.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/icon-foreground.png
  adaptive_icon_monochrome: assets/branding/icon-monochrome.png
  min_sdk_android: 21
